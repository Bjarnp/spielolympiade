<form (ngSubmit)="confirm()" class="password-dialog">
  <div class="dialog-heading">
    <span class="dialog-icon"><mat-icon>lock</mat-icon></span>
    <div><span>Sicherheitsprüfung</span><h2 mat-dialog-title>{{ data.title }}</h2></div>
    <button type="button" mat-icon-button mat-dialog-close aria-label="Schließen"><mat-icon>close</mat-icon></button>
  </div>
  <mat-dialog-content>
    <p>{{ data.message || 'Bitte bestätige diese Aktion mit deinem Passwort.' }}</p>
    <mat-form-field appearance="outline">
      <mat-label>Passwort</mat-label>
      <mat-icon matPrefix>key</mat-icon>
      <input matInput type="password" name="password" [(ngModel)]="password" autocomplete="current-password" autofocus />
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button type="button" mat-button mat-dialog-close>Abbrechen</button>
    <button type="submit" mat-flat-button color="primary" [disabled]="!password">{{ data.confirmLabel || 'Bestätigen' }}</button>
  </mat-dialog-actions>
</form>
